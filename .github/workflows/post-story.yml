name: post-story
on:
  schedule:
    # JST = UTC+9. GitHub may start a few minutes late.
    - cron: '0 10 * * *'   # 19:00 JST
    - cron: '0 11 * * *'   # 20:00 JST
    - cron: '0 12 * * *'   # 21:00 JST
  workflow_dispatch:       # manual run (GitHub app / web: Actions > post-story > Run workflow)
  push:
    branches: [main]
    paths: ['queue/**']    # runs only when commit message contains "#now"
permissions:
  contents: write
concurrency:
  group: post-story
  cancel-in-progress: false
jobs:
  post:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '#now')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: bash scripts/post.sh
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SCHEDULE: ${{ github.event.schedule }}
